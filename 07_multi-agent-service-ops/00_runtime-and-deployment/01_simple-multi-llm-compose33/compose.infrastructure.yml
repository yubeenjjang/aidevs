name: simple-multi-llm-infrastructure

services:
  database:
    image: postgres:17-alpine
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Required by the separately deployed backend container through
      # host.docker.internal. Do not expose this port in the EC2 Security Group.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Required by the separately deployed backend container through
      # host.docker.internal. Do not expose this port in the EC2 Security Group.
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
